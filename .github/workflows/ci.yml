name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The runner image ships Google Chrome; the smoke test drives it directly.
      - run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
